# =============================================================================
# CI — bypass-prompt (frederico-kluser/bypass-prompt)
#
# Python stdlib-only: lint = compilação; test = selftest determinístico offline.
# Actions fixadas por SHA (verificado: repos/<owner>/<repo>/commits/<tag>).
# =============================================================================

name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

# Privilégio mínimo: o CI só precisa de ler o repositório.
permissions:
  contents: read

# Evita corridas duplicadas e desperdiçadas no mesmo PR/ramo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (compilação)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compila todos os módulos
        run: python -m py_compile scripts/bypass.py scripts/strategies.py scripts/harden.py scripts/defesa.py

      - name: Checklist de hardening nos templates
        run: |
          for t in corporativo-pt corporativo-en agentico-pt; do
            python scripts/harden.py render --template "$t" --out "template-$t.md"
            python scripts/harden.py check --file "template-$t.md"
          done

      - name: Pipeline de defesa e taxonomia
        run: |
          python scripts/bypass.py pipeline > /dev/null
          python scripts/bypass.py taxonomy --json > /dev/null

  test:
    name: Selftest (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Selftest (offline, determinístico)
        run: python scripts/bypass.py selftest

  # Job AGREGADOR — o seu NOME (`build`) é o `context` exigido pelo ruleset
  # (regras-main.json). Não renomeie sem atualizar o ruleset. Valida as
  # mensagens de commit: é assim que os Conventional Commits são impostos
  # também no servidor (a regra de metadata é Enterprise-only).
  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Commits convencionais (últimos 25)
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          header = re.compile(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?!?: .+')
          skip = re.compile(r'^(Merge |Revert "|Reapply "|fixup!|squash!)')
          out = subprocess.run(['git', 'log', '--pretty=tformat:%s', '-n', '25', 'HEAD'],
                               capture_output=True, text=True).stdout
          bad = 0
          for s in out.splitlines():
              s = s.strip()
              if not s or skip.match(s):
                  continue
              h = re.sub(r'\s+\(#\d+\)$', '', s)   # sufixo "(#N)" do squash não conta
              if not header.match(h) or len(h) > 72:
                  print('ERRO: mensagem fora de Conventional Commits:', s); bad = 1
              else:
                  print('OK  :', s)
          sys.exit(bad)
          PY
